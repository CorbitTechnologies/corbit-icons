<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corbit Icons | Premium Open Source Icons</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/corbit-mono@latest/dist/corbit-mono.css">
    <style>
        body { font-family: 'Corbit Mono', monospace; background-color: #050505; color: #e5e5e5; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 5px; border: 2px solid #0a0a0a; }
        ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .icon-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .icon-card:hover { background: rgba(59, 130, 246, 0.05); transform: translateY(-4px) scale(1.02); border-color: rgba(59, 130, 246, 0.3); box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.2); }
        .sticky-search { position: sticky; top: 0; z-index: 40; background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .copied-toast { animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, fadeOut 0.4s ease-in 2s forwards; }
        @keyframes slideUp { from { transform: translateY(100%) scale(0.9); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-10px); } }
    </style>
</head>
<body class="min-h-screen">
    <header class="pt-24 pb-16 px-6 text-center">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs font-bold tracking-widest uppercase mb-8">
            <span class="relative flex h-2 w-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span>
            </span>
            Open Source v1.0
        </div>
        <h1 class="text-6xl md:text-8xl font-bold tracking-tight text-white mb-6">Corbit <span class="bg-gradient-to-r from-blue-400 to-indigo-600 bg-clip-text text-transparent">Icons</span></h1>
        <p class="text-gray-400 text-lg md:text-xl max-w-2xl mx-auto font-light leading-relaxed">Ultra-light, vibe-coded icons for modern apps. <br> A premium collection of 50+ sharp, professional SVGs.</p>
    </header>

    <section class="max-w-4xl mx-auto px-6 mb-20">
        <div class="grid md:grid-cols-2 gap-8">
            <div class="glass rounded-[2rem] p-8 border border-white/5 relative overflow-hidden group hover:bg-white/[0.03] transition-all duration-500">
                <h3 class="text-blue-400 font-bold mb-6 flex items-center gap-3">Web (Any Framework)</h3>
                <div class="bg-neutral-950 rounded-2xl p-5 font-mono text-sm border border-white/5 mb-6 group-hover:border-blue-500/30 transition-all duration-300 shadow-inner">
                    <code class="text-gray-400"><span class="text-blue-500">$</span> npm install <span class="text-white font-bold">corbit-icons</span></code>
                </div>
            </div>
            <div class="glass rounded-[2rem] p-8 border border-white/5 relative overflow-hidden group hover:bg-white/[0.03] transition-all duration-500">
                <h3 class="text-indigo-400 font-bold mb-6 flex items-center gap-3">Flutter & Mobile</h3>
                <div class="bg-neutral-950 rounded-2xl p-5 font-mono text-sm border border-white/5 mb-6 group-hover:border-indigo-500/30 transition-all duration-300 shadow-inner">
                    <code class="text-gray-400"><span class="text-indigo-500">$</span> flutter pub add <span class="text-white font-bold">corbit_icons</span></code>
                </div>
            </div>
        </div>
    </section>

    <div class="sticky-search py-6 px-6 mb-16">
        <div class="max-w-4xl mx-auto">
            <div class="relative group">
                <input type="text" id="search-input" placeholder="Search icons..." class="w-full bg-neutral-900/40 border border-neutral-800 rounded-2xl py-5 px-8 pl-14 text-xl focus:outline-none focus:border-blue-500/50 transition-all duration-300">
                <div class="absolute left-5 top-1/2 -translate-y-1/2 text-gray-500 group-focus-within:text-blue-500 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
            </div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-6 pb-24">
        <div id="icon-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-4"></div>
    </main>

    <div id="toast-container" class="fixed bottom-8 right-8 z-50 flex flex-col gap-3"></div>

org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>"},{"name":"users","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg>"},{"name":"video","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"23 7 16 12 23 17 23 7\"/><rect x=\"1\" y=\"5\" width=\"15\" height=\"14\" rx=\"2\" ry=\"2\"/></svg>"},{"name":"x","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"/><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"/></svg>"}];
        const iconGrid = document.getElementById('icon-grid');
        const searchInput = document.getElementById('search-input');
        const toastContainer = document.getElementById('toast-container');
        function renderIcons(data) {
            iconGrid.innerHTML = '';
            data.forEach(icon => {
                const card = document.createElement('div');
                card.className = 'icon-card glass rounded-2xl p-6 flex flex-col items-center justify-center gap-4 cursor-pointer transition-all duration-300 group';
                card.innerHTML = `
                    <div class="text-gray-400 group-hover:text-blue-400 transition-colors w-10 h-10">
                        ${icon.svg.replace('<svg', '<svg class="w-full h-full"')}
                    </div>
                    <span class="text-xs font-medium text-gray-500 group-hover:text-gray-200 transition-colors capitalize">${icon.name.replace(/-/g, ' ')}</span>
                `;
                card.addEventListener('click', () => copyToClipboard(icon.svg, icon.name));
                iconGrid.appendChild(card);
            });
        }
        async function copyToClipboard(svg, name) {
            try {
                await navigator.clipboard.writeText(svg);
                showToast(`Copied ${name.replace(/-/g, ' ')} SVG!`);
            } catch (err) { console.error('Failed to copy: ', err); }
        }
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'copied-toast bg-blue-600 text-white px-6 py-3 rounded-xl shadow-2xl font-medium flex items-center gap-3';
            toast.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>${message}`;
            toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = iconData.filter(icon => icon.name.toLowerCase().includes(term));
            renderIcons(filtered);
        });
        renderIcons(iconData);
    </script>
