<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corbit Icons | Premium Open Source Icons</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/corbit-mono@latest/dist/corbit-mono.css">
    <style>
        body {
            font-family: 'Corbit Mono', monospace;
            background-color: #050505;
            color: #e5e5e5;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 5px;
            border: 2px solid #0a0a0a;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3b82f6;
        }

        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .icon-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .icon-card:hover {
            background: rgba(59, 130, 246, 0.05);
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.2);
        }

        .sticky-search {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .copied-toast {
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, fadeOut 0.4s ease-in 2s forwards;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%) scale(0.9);
                opacity: 0;
            }

            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }

            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }
    </style>
</head>

        const iconGrid = document.getElementById('icon-grid');
        const searchInput = document.getElementById('search-input');
        const toastContainer = document.getElementById('toast-container');

        const wrapSvg = (content, className = '') => `
            <svg class="${className}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
                ${content}
            </svg>
        `;

        function renderIcons(data) {
            iconGrid.innerHTML = '';
            data.forEach(icon => {
                const card = document.createElement('div');
                card.className = 'icon-card glass rounded-2xl p-6 flex flex-col items-center justify-center gap-4 cursor-pointer transition-all duration-300 group';
                card.innerHTML = `
                    <div class="text-gray-400 group-hover:text-blue-400 transition-colors w-10 h-10">
                        ${wrapSvg(icon.svg, 'w-full h-full')}
                    </div>
                    <span class="text-xs font-medium text-gray-500 group-hover:text-gray-200 transition-colors capitalize">${icon.name.replace(/-/g, ' ')}</span>
                `;
                card.addEventListener('click', () => copyToClipboard(wrapSvg(icon.svg), icon.name));
                iconGrid.appendChild(card);
            });
        }

        async function copyToClipboard(svg, name) {
            try {
                await navigator.clipboard.writeText(svg.trim());
                showToast(`Copied ${name.replace(/-/g, ' ')} SVG!`);
            } catch (err) { console.error('Failed to copy: ', err); }
        }
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'copied-toast bg-blue-600 text-white px-6 py-3 rounded-xl shadow-2xl font-medium flex items-center gap-3';
            toast.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>${message}`;
            toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = iconData.filter(icon => icon.name.toLowerCase().includes(term));
            renderIcons(filtered);
        });
        renderIcons(iconData);
    </script>
