name: corbit_icons
description: A new Flutter package for Corbit Icons.
version: 1.1.0
homepage: https://corbit.tech
repository: https://github.com/corbittechnologies/corbit-icons

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  lints: ^3.0.0

flutter:
  fonts:
    - family: CorbitIcons-Regular
      fonts: [{ asset: fonts/CorbitIcons-Regular.ttf }]
    - family: CorbitIcons-Thin
      fonts: [{ asset: fonts/CorbitIcons-Thin.ttf }]
    - family: CorbitIcons-Light
      fonts: [{ asset: fonts/CorbitIcons-Light.ttf }]
    - family: CorbitIcons-Bold
      fonts: [{ asset: fonts/CorbitIcons-Bold.ttf }]
    - family: CorbitIcons-Fill
      fonts: [{ asset: fonts/CorbitIcons-Fill.ttf }]