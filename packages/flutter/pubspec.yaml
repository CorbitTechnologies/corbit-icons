name: corbit_icons
description: A new Flutter package for Corbit Icons.
version: 1.0.0
homepage: https://corbit.tech
repository: https://github.com/corbittechnologies/corbit-icons

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^2.0.0

flutter:
  fonts:
    - family: CorbitIcons
      fonts:
        - asset: fonts/CorbitIcons.ttf
